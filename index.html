<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Trafic aérien mondial - D3.js</title>

  <!-- D3.js -->
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header>
    <h1>Trafic aérien mondial</h1>
    <p>Visualisation des flux aériens mondiaux à l’aide de D3.js</p>
  </header>

  <main>
    <section id="map-section">
  <h2>Carte mondiale des routes aériennes</h2>

  <div id="map-container">
    <div id="filter-panel">
      <label for="airport-select">Filtrer par aéroport :</label>
      <select id="airport-select">
        <option value="all">Tous</option>
      </select>
    </div>

    <svg id="map"></svg>
  </div>
</section>
    
    <section id="chart-section">
      <h2>Top aéroports par volume de trafic</h2>
      <svg id="chart"></svg>
    </section>
    <section id="line-chart-section">
  <h2>Nombre de départs par pays</h2>
  <svg id="line-chart"></svg>
</section>
  </main>

  <footer>
    <p>Projet D3.js – Données issues d’OpenFlights</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
